name: Pull Request Tests

on:
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: pr-tests-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    unit:
        name: Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set Up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Run Unit Tests with V8 Coverage
              run: npm run test:coverage

            - name: Upload Unit Coverage
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: unit-coverage-${{ github.event.pull_request.number }}
                  path: coverage/
                  if-no-files-found: ignore
                  retention-days: 7

    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            matrix:
                browser: [chromium, firefox]
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set Up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            # Cache the browser binaries. This assumes npm; the lockfile is a proxy for the
            # Playwright version, so it usually turns over when you update Playwright.
            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

            # Cache miss: download browsers and system libraries together
            - name: Install browsers and system dependencies
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps

            # Cache hit: binaries are restored, but system libraries still need installing
            - name: Install OS dependencies for browsers
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps

            - name: Typecheck, Build and Run Chromium and Firefox Tests
              run: npm run test:e2e
              env:
                  BROWSER: ${{ matrix.browser }}

            - name: Upload Failure Evidence
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-failure-${{ github.event.pull_request.number }}
                  path: test-results/
                  if-no-files-found: ignore
                  retention-days: 7
