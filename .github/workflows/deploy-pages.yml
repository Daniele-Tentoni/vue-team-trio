name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build:
        name: Build Pages Artifact
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pages: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set Up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Install Dependencies
              run: npm ci

            - name: Run Unit Tests with V8 Coverage
              run: npm run test:coverage

            - name: Typecheck and Build
              run: npm run build

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        name: Publish Pages
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v4
